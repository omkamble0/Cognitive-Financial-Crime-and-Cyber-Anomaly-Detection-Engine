apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fincipher.fullname" . }}-config
  labels:
    {{- include "fincipher.labels" . | nindent 4 }}
data:
  APP_ENV: "{{ .Values.env.APP_ENV }}"
  INFERENCE_SLA_MS: "{{ .Values.env.INFERENCE_SLA_MS }}"
  LOG_LEVEL: "{{ .Values.env.LOG_LEVEL }}"
  ENABLE_GRAPH_DIFFUSION: "{{ .Values.env.ENABLE_GRAPH_DIFFUSION }}"
  GRAPH_CACHE_TTL_SEC: "{{ .Values.env.GRAPH_CACHE_TTL_SEC }}"
  CANARY_SHADOW_TRAFFIC_PCT: "{{ .Values.env.CANARY_SHADOW_TRAFFIC_PCT }}"
