version: '3.8'

networks:
  fincipher-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: fincipher_postgres
    networks:
      - fincipher-net
    environment:
      POSTGRES_USER: fincipher
      POSTGRES_PASSWORD: fincipher_secure_password
      POSTGRES_DB: fincipher_ai
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincipher -d fincipher_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fincipher_redis
    networks:
      - fincipher-net
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: fincipher_zookeeper
    networks:
      - fincipher-net
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:latest
    container_name: fincipher_kafka
    networks:
      - fincipher-net
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fincipher_api_gateway
    networks:
      - fincipher-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://fincipher:fincipher_secure_password@postgres:5432/fincipher_ai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INFERENCE_SLA_MS=3.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fincipher_async_worker
    networks:
      - fincipher-net
    depends_on:
      - api
      - kafka
      - redis
    command: ["python", "-m", "apps.worker.worker"]
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://fincipher:fincipher_secure_password@postgres:5432/fincipher_ai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    restart: unless-stopped

volumes:
  pgdata:
