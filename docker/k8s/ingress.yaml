apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisflow-ingress
  namespace: aegisflow
  labels:
    app: aegisflow
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Rate Limiting & DDoS Defense
    nginx.ingress.kubernetes.io/limit-rps: "500"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3, TLSv1.2"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
spec:
  tls:
    - hosts:
        - aegisflow.internal.bank.net
        - api.aegisflow.io
      secretName: aegisflow-tls-cert
  rules:
    - host: api.aegisflow.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegisflow-service
                port:
                  number: 8000
