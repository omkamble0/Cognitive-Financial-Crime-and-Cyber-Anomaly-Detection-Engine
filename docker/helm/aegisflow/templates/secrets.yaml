apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisflow.fullname" . }}-secrets
  labels:
    {{- include "aegisflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  KAFKA_SASL_PASSWORD: {{ .Values.secrets.kafkaSaslPassword | quote }}
  MERKLE_AUDIT_SALT: {{ .Values.secrets.merkleAuditSalt | quote }}
  JWT_SIGNING_KEY: {{ .Values.secrets.jwtSigningKey | quote }}
