apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegisflow-hpa
  namespace: aegisflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegisflow-core
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
