apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisflow-config
  namespace: aegisflow
  labels:
    app: aegisflow
    tier: api-engine
data:
  APP_ENV: "production"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  INFERENCE_SLA_MS: "3.5"
  REDIS_HOST: "redis-service.aegisflow.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.aegisflow.svc.cluster.local:9092"
  LOG_LEVEL: "INFO"
  ENABLE_GRAPH_DIFFUSION: "true"
  GRAPH_CACHE_TTL_SEC: "2.0"
  CANARY_SHADOW_TRAFFIC_PCT: "100"
