apiVersion: v1
kind: Service
metadata:
  name: aegisflow-service
  namespace: aegisflow
  labels:
    app: aegisflow
spec:
  type: ClusterIP
  selector:
    app: aegisflow
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 8000
      protocol: TCP
