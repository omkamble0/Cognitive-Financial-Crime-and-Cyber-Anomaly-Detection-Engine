apiVersion: v1
kind: Secret
metadata:
  name: aegisflow-secrets
  namespace: aegisflow
  labels:
    app: aegisflow
    tier: api-engine
type: Opaque
stringData:
  # In enterprise deployments, inject via HashiCorp Vault, AWS Secrets Manager, or SealedSecrets
  REDIS_PASSWORD: "CHANGE_ME_SECURE_TOKEN_REDIS_AES256"
  KAFKA_SASL_PASSWORD: "CHANGE_ME_SECURE_TOKEN_KAFKA_SCRAM"
  MERKLE_AUDIT_SALT: "aegis_enterprise_hmac_salt_f79a3b8e2c"
  JWT_SIGNING_KEY: "aegis_jwt_hs512_secret_key_prod_cluster"
