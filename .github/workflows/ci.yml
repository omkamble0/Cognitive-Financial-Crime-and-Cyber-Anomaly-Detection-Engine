name: AegisFlow CI/CD Pipeline & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-quality-gate:
    name: Unit & Integration Regression Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System & Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov pydantic pydantic-settings pyjwt scikit-learn pandas numpy fastapi starlette uvicorn

    - name: Static Code Analysis & Linting
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics --exclude=venv,.venv

    - name: Execute Phase 1 & 2 Security & Case Management Tests
      run: |
        python -m unittest -v tests/test_phase1.py

    - name: Execute Full Fraud Detection Pipeline Test Suite
      run: |
        python -m unittest -v tests/test_pipeline.py

  container-security-gate:
    name: Docker Build & CIS Non-Root Audit
    runs-on: ubuntu-latest
    needs: test-and-quality-gate

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Production Multi-Stage Container
      run: |
        docker build -f docker/Dockerfile -t aegisflow-engine:latest .

    - name: Audit CIS Docker Non-Root Service Account (UID 10001)
      run: |
        USER_ID=$(docker run --rm aegisflow-engine:latest id -u)
        echo "Container executed with effective UID: $USER_ID"
        if [ "$USER_ID" -ne "10001" ]; then
          echo "ERROR: Container is not running as restricted aegisuser (UID 10001)!"
          exit 1
        fi
