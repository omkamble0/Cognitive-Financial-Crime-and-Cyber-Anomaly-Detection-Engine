# =============================================================================
# AegisFlow - Production Values Configuration (Helm 3)
# =============================================================================

replicaCount: 3

image:
  repository: aegisflow/engine
  pullPolicy: IfNotPresent
  tag: "v2.3-core"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "aegisflow-sa"

# CIS Benchmark Hardened Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  metricsPort: 9090

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/limit-rps: "500"
    nginx.ingress.kubernetes.io/limit-connections: "100"
  hosts:
    - host: api.aegisflow.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aegisflow-tls-cert
      hosts:
        - api.aegisflow.io

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 8Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingressNamespace: "ingress-nginx"
  monitoringNamespace: "monitoring"

config:
  appEnv: "production"
  inferenceSlaMs: "3.5"
  redisHost: "redis-service.aegisflow.svc.cluster.local"
  redisPort: "6379"
  kafkaBootstrapServers: "kafka-service.aegisflow.svc.cluster.local:9092"
  logLevel: "INFO"
  enableGraphDiffusion: "true"
  graphCacheTtlSec: "2.0"
  canaryShadowTrafficPct: "100"

secrets:
  redisPassword: "CHANGE_ME_SECURE_TOKEN_REDIS"
  kafkaSaslPassword: "CHANGE_ME_SECURE_TOKEN_KAFKA"
  merkleAuditSalt: "aegis_enterprise_hmac_salt_f79a3b8e2c"
  jwtSigningKey: "aegis_jwt_hs512_secret_key_prod_cluster"

serviceMonitor:
  enabled: true
  interval: "15s"
  scrapeTimeout: "10s"
  path: "/metrics"
