apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisflow-core
  namespace: aegisflow
  labels:
    app: aegisflow
    tier: api-engine
    version: v2.3-core
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aegisflow
  template:
    metadata:
      labels:
        app: aegisflow
        tier: api-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      # CIS Kubernetes Benchmark: Hardened Pod Security Standards
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - aegisflow
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: aegisflow-engine
          image: aegisflow/engine:v2.3-core
          imagePullPolicy: IfNotPresent
          # CIS Benchmark & PCI-DSS 4.0: Restricted Container Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http-api
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aegisflow-config
            - secretRef:
                name: aegisflow-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            # Ephemeral in-memory write mount for /tmp (allows readOnlyRootFilesystem)
            - name: tmp-volume
              mountPath: /tmp
            - name: scratch-data
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: scratch-data
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
